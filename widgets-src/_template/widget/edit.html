<!-- EDIT template: the config form, inside the SOAR modal shell. Bind to object
     properties (config.X), never bare words: ng-include/ng-if/ng-repeat create
     child scopes and a bare ng-model writes shadow the parent. See
     KNOWLEDGEBASE.md. -->
<form data-ng-submit="save()" name="editMyWidgetForm" class="noMargin" novalidate>
  <div class="modal-header">
    <h3 class="modal-title">My Widget - Settings</h3>
    <button type="button" class="close" data-ng-click="cancel()"
            data-testid="my-widget-cfg-close" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body my-widget-edit">
    <div class="form-group">
      <label for="my-widget-title">Title</label>
      <input id="my-widget-title" type="text" class="form-control"
             data-testid="my-widget-cfg-title"
             data-ng-model="config.title" />
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-default" data-ng-click="cancel()"
            data-testid="my-widget-cfg-cancel">Cancel</button>
    <button type="submit" class="btn btn-primary"
            data-testid="my-widget-cfg-save">Save</button>
  </div>
</form>
